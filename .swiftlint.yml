disabled_rules:
  - line_length
  - identifier_name
  - type_name

opt_in_rules:
  - empty_count
  - missing_docs

analyzer_rules:
  - unused_import

file_length:
  warning: 400
  error: 800

type_body_length:
  warning: 300
  error: 600

function_body_length:
  warning: 40
  error: 80

cyclomatic_complexity:
  warning: 10
  error: 15

nesting:
  type_level:
    warning: 4
    error: 6
  function_level:
    warning: 3
    error: 5
